name: Refresh ocean data

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小時更新「今日海況」
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-ocean-data.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet public/data/ocean.json; then
            git config user.name "midisea-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/ocean.json
            git commit -m "chore: refresh 今日海況資料"
            git push
          else
            echo "ocean.json unchanged"
          fi
